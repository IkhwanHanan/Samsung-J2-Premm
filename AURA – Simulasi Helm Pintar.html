<style>

</style></head><body>

<div class="card"><h3>Grafik 60 detik terakhir</h3><canvas id="ch"></canvas>

<div class="card"><h3>Statistik ringkasan sesi</h3><div class="ov"><table id="tb"></table></div><h3 style="margin-top:12px">Log kejadian</h3><div id="lg"></div></div>
